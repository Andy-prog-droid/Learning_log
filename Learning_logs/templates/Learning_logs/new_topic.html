{% extends "Learning_logs/base.html" %}

{% block content %}
  <p>Add a new topic:</p>

  <!-- The action sends data back to our new_topic view -->
  <form action="{% url 'Learning_logs:new_topic' %}" method='post'>
    {% csrf_token %}
    {{ form.as_p }}
    <button name="submit">Add topic</button>
  </form>
{% endblock content %}
